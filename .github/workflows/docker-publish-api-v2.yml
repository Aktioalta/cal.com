name: Build & Push Cal.diy API v2

on:
  workflow_dispatch:
  push:
    branches: [ main, "develop/*", "release/*" ]
    paths:
      - 'apps/api/v2/**'
      - 'packages/prisma/**'

jobs:
  build-api-v2:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version tag (YYYYMMDD.iteration)
        id: tag
        run: |
          DATE=$(date +%Y%m%d)
          echo "version=${DATE}.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api-v2
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/v2/Dockerfile
          push: true
          tags: |
            ghcr.io/mickaelbeaudry/calcom-api-v2:${{ steps.tag.outputs.version }}
            ghcr.io/mickaelbeaudry/calcom-api-v2:latest
          cache-from: type=local,src=/tmp/.buildx-cache-cal-apiv2
          cache-to: type=local,dest=/tmp/.buildx-cache-cal-apiv2-new,mode=max

      - name: Rotate local cache
        run: |
          rm -rf /tmp/.buildx-cache-cal-apiv2
          mv /tmp/.buildx-cache-cal-apiv2-new /tmp/.buildx-cache-cal-apiv2
